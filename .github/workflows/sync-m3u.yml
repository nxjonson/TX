name: Sync M3U

on:
  schedule:
    - cron: '05 22 * * *'  # 北京时间每天凌晨6点05分
  workflow_dispatch:       # 保留手动触发

permissions:
  contents: write          # 仅授予必要权限

# 全局环境变量：强制所有JS动作使用Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # 使用官方存在的最新稳定版 v4.2.1（支持Node.js 24）
        uses: actions/checkout@v4.2.1
        with:
          persist-credentials: true
          fetch-depth: 0              # 拉取完整历史，避免提交冲突

      - name: 创建空的requirements.txt（消除Python依赖提示）
        run: touch requirements.txt

      - name: Set up Python
        # 使用官方存在的最新稳定版 v5.2.0（支持Node.js 24）
        uses: actions/setup-python@v5.2.0
        with:
          python-version: '3.x'
          cache: 'pip'                     # 缓存Python依赖（空文件不影响）

      - name: Check trigger type
        id: check_trigger
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Current UTC time: $(date -u)"
          echo "trigger_type=schedule_or_manual" >> "$GITHUB_OUTPUT"

      - name: Fetch source M3U file (模拟浏览器请求头)
        id: fetch_m3u
        if: steps.check_trigger.outputs.trigger_type == 'schedule_or_manual'
        env: 
         M3U_URL: ${{ secrets.M3U_SOURCE_URL }}
        run: |
          set -euo pipefail
          # 核心：1:1 模拟 Chrome 浏览器请求头，适配 ottiptv.cc 的指纹校验
          curl -fL \
            --http1.1 \                    # 禁用 HTTP/2，适配源服务器
            --no-alpn \                    # 关闭 ALPN 协商
            --no-npn \                     # 关闭 NPN 协商
            --retry 3 \                    # 重试 3 次
            --retry-delay 15 \             # 每次重试间隔 15 秒
            --connect-timeout 40 \         # 连接超时 40 秒
            --max-time 180 \               # 总超时 3 分钟
            --compressed \                 # 开启 gzip 解压，匹配浏览器行为
            # 完整浏览器请求头（关键）
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" \
            -H "Accept-Language: zh-CN,zh;q=0.9,en;q=0.8" \
            -H "Accept-Encoding: gzip, deflate, br" \
            -H "Connection: keep-alive" \
            -H "Upgrade-Insecure-Requests: 1" \
            -H "Sec-Fetch-Dest: document" \
            -H "Sec-Fetch-Mode: navigate" \
            -H "Sec-Fetch-Site: none" \
            -H "Sec-Fetch-User: ?1" \
            -H "Cache-Control: max-age=0" \
            # 输出文件
            -o iptv.m3u "$M3U_URL" || {
              echo "WARNING: M3U 源下载失败，跳过本次同步"
              echo "fetch_success=false" >> "$GITHUB_OUTPUT"
              exit 0
            }
          
          # 校验文件有效性
          if [ ! -f "iptv.m3u" ] || [ ! -s "iptv.m3u" ]; then
            echo "WARNING: M3U 文件为空或不存在，跳过本次同步"
            echo "fetch_success=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          echo "fetch_success=true" >> "$GITHUB_OUTPUT"
          echo "✅ 模拟浏览器请求头下载成功！"
          echo "📄 文件大小：$(du -h iptv.m3u | awk '{print $1}')"
          echo "📝 文件行数：$(wc -l < iptv.m3u)"

      - name: Process & generate li.m3u
        if: steps.check_trigger.outputs.trigger_type == 'schedule_or_manual' && steps.fetch_m3u.outputs.fetch_success == 'true'
        run: |
          python3 <<'EOF'
          import re, sys
          import os

          UA_HINT = "##UA-Hint: 请将 User-Agent 设置为 okHttp/Mod-1.5.0.0 ，否则无法观看"

          # 兜底检查文件
          if not os.path.exists("iptv.m3u") or os.path.getsize("iptv.m3u") == 0:
              print("[ERROR] iptv.m3u 文件不存在或为空")
              sys.exit(1)
          
          try:
              with open("iptv.m3u", "r", encoding="utf-8", errors="ignore") as f:
                  lines = f.read().splitlines()
          except Exception as e:
              print("[ERROR] 读取 iptv.m3u 失败：", e)
              sys.exit(1)

          if not lines:
              print("[ERROR] iptv.m3u 内容为空")
              sys.exit(1)

          header0 = lines[0].strip() if lines else "#EXTM3U"
          header1 = UA_HINT
          print(f"[INFO] 头部1：{header0}")
          print(f"[INFO] 头部2：{header1}")

          body = lines[2:] if len(lines) > 2 else []
          weishi, cctv, migu, weishi_mcp = [], [], [], []

          # 过滤规则保持不变
          skip_group = re.compile(r'group-title="(4K频道|熊猫|影视|地方|少儿|教育|其他|体育|印象天下|纪实|综艺|新闻)"')
          skip_name  = re.compile(r'(cgtnru-MCP|cgtndoc-MCP|cgtn-MCP|CGTNALBY|cctv16-MST|cctv8k-MCP|CGTN外语纪录|CGTN阿拉伯语|CGTN西班牙语|CGTN法语|CGTN俄语|CGTN|老故事|发现之旅|中学生|四海钓鱼|24小时|最经典|传奇|体坛|精英|cgtnfr|怀旧剧场)')
          migu_exclude_name = re.compile(r'(吉林|青海|海南|海峡|中国农林|兵团|河南|陕西|大湾|东南)')
          weishi_mcp_exclude = re.compile(r'(云南|兵团|甘肃|新疆|西藏|海南|青海|内蒙古|山西|陕西|河南)')

          def is_cctv(extinf): 
              return bool(re.search(r'group-title="[^"]*央视"|CCTV|cctv', extinf))
          def is_weishi(extinf): 
              return bool(re.search(r'group-title="[^"]*卫视"', extinf))
          def is_weishi_mcp(extinf): 
              return bool(re.search(r'-MCP', extinf))

          i, n = 0, len(body)
          while i < n:
              if not body[i].startswith("#EXTINF"):
                  i += 1
                  continue
              extinf = body[i]
              if skip_group.search(extinf) or skip_name.search(extinf):
                  i += 2
                  continue
              url = body[i+1] if (i+1 < n and body[i+1].startswith("http")) else None
              if not url:
                  i += 1
                  continue
              
              # 过滤咪咕
              if (re.search(r'migu', url, re.I) or
                   re.search(r'\bmg\b', url, re.I) or
                   'mgtv.ottiptv.cc' in url.lower()):
                  if not migu_exclude_name.search(extinf):
                      migu.append(extinf)
                      migu.append(url)
              # MCP 卫视过滤
              elif is_weishi(extinf) and is_weishi_mcp(extinf):
                  if not weishi_mcp_exclude.search(extinf):
                      weishi_mcp.append(extinf)
                      weishi_mcp.append(url)
              # 普通卫视
              elif is_weishi(extinf):
                  weishi.append(extinf)
                  weishi.append(url)
              # 央视
              elif is_cctv(extinf):
                  cctv.append(extinf)
                  cctv.append(url)
              # 默认归为卫视
              else:
                  weishi.append(extinf)
                  weishi.append(url)
              i += 2

          # 输出统计信息
          print(f"[INFO] 央视：{len(cctv)//2} 个，MCP卫视：{len(weishi_mcp)//2} 个，普通卫视：{len(weishi)//2} 个")

          # 生成 li.m3u
          out_lines = [header0, header1] + cctv + weishi_mcp + weishi 
          with open("li.m3u", "w", encoding="utf-8") as f:
              f.write("\n".join(out_lines) + "\n")

          # 追加 1.m3u（容错处理）
          if os.path.exists("1.m3u") and os.path.getsize("1.m3u") > 0:
              with open("1.m3u", "r", encoding="utf-8", errors="ignore") as f:
                  dmys_content = f.read()
              with open("li.m3u", "a", encoding="utf-8") as li_f:
                  li_f.write(dmys_content)
              print("[INFO] ✅ 1.m3u 内容已追加到 li.m3u")
          else:
              print("[WARNING] 1.m3u 文件不存在或为空，跳过追加")
          EOF

      - name: Commit and push li.m3u changes
        if: steps.check_trigger.outputs.trigger_type == 'schedule_or_manual' && steps.fetch_m3u.outputs.fetch_success == 'true'
        run: |
          set -euo pipefail
          # 配置 git 身份
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          # 拉取最新代码，避免提交冲突
          git pull origin main --rebase || true
          
          git add li.m3u
          # 检查是否有变更
          if git diff --cached --quiet; then
            echo "ℹ️ No changes to li.m3u, skip commit"
            echo "m3u_changed=false" >> "$GITHUB_OUTPUT"
          else:
            # 提交并推送
            git commit -m "chore: update li.m3u $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin main
            echo "✅ li.m3u updated and pushed successfully"
            echo "m3u_changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}